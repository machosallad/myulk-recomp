<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Myulk</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #canvas {
      display: block; width: 100vw; height: 100vh;
      object-fit: contain; image-rendering: pixelated; outline: none;
    }
    #status {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #ccc; font: 16px system-ui, sans-serif; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">Laddar…</div>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus: function (text) {
        var el = document.getElementById('status');
        el.textContent = text;
        el.style.display = text ? 'flex' : 'none';
      },
      print: function (t) { console.log(t); },
      printErr: function (t) { console.warn(t); }
    };
    Module.canvas.addEventListener('click', function () { Module.canvas.focus(); });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
